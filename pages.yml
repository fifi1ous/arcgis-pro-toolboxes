# Sestaví web z docs/ a nasadí ho na GitHub Pages.
# Před sestavením zabalí každou složku toolboxy/<sekce>/<Toolbox>/ do docs/stazeni/<Toolbox>.zip,
# takže odkazy ke stažení jsou vždy aktuální podle obsahu repozitáře.
#
# Nastavení repozitáře: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Web a stahovací balíčky

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zabalit toolboxy do zipů
        run: |
          mkdir -p docs/stazeni
          for dir in toolboxy/*/*/; do
            name=$(basename "$dir")
            (cd "$(dirname "$dir")" && zip -r -q "$GITHUB_WORKSPACE/docs/stazeni/$name.zip" "$name" -x '*/__pycache__/*' '*.pyc')
            echo "Zabaleno: $name.zip"
          done

      - uses: actions/configure-pages@v5

      - name: Sestavit web (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
